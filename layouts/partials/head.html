<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>
  {{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{
  end }}
</title>
<meta
  name="description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.Description }}{{ end }}"
/>
<link rel="canonical" href="{{ .Permalink }}" />
<link rel="stylesheet" href="/css/style.css" />

<!-- Open Graph / Twitter Cards -->
<meta property="og:title" content="{{ .Title }}" />
<meta
  property="og:description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.Description }}{{ end }}"
/>
<meta
  property="og:type"
  content="{{ if .IsPage }}article{{ else }}website{{ end }}"
/>
<meta property="og:url" content="{{ .Permalink }}" />
{{ with .Params.image }}<meta
  property="og:image"
  content="{{ . | absURL }}"
/>{{ end }}
<meta name="twitter:card" content="summary_large_image" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
  rel="stylesheet"
/>
